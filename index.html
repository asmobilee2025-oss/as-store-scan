<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>جرد المخزون</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#1c1b1b; --card:#262422; --ink:#f4efe9; --muted:#a79e93;
    --accent:#e07a3a; --clay:#bf5a3f; --ok:#1e7e34; --bad:#b02a37; --dup:#a9830d;
    --line:#38342f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Arial,sans-serif;
    min-height:100vh;padding:14px 14px 28px;max-width:520px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .brand{font-weight:800;letter-spacing:.5px;font-size:18px}
  .brand span{color:var(--accent)}
  .count{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800}
  .count b{color:var(--accent);font-size:19px}
  #reader{width:100%;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
  #reader video{border-radius:16px}
  .res{margin-top:12px;padding:16px;border-radius:16px;font-weight:800;font-size:18px;line-height:1.5;
    background:var(--card);border:1px solid var(--line);min-height:30px;text-align:center;transition:background .15s}
  .res.ok{background:var(--ok);border-color:var(--ok)}
  .res.bad{background:var(--bad);border-color:var(--bad)}
  .res.dup{background:var(--dup);border-color:var(--dup)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;font-weight:500}
  .row{display:flex;gap:8px;margin-top:12px}
  input[type=text],input[type=url]{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none;font-family:inherit}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#1a1a1a;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  details{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  summary{cursor:pointer;font-weight:700;color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .log{margin-top:12px;font-size:13px;color:var(--muted);max-height:34vh;overflow:auto}
  .log div{padding:6px 2px;border-bottom:1px solid var(--line)}
  .log .t-ok{color:#7fd79a}.log .t-dup{color:#e7c35a}.log .t-bad{color:#e88}
</style>
</head>
<body>
  <header>
    <div class="brand">A'<span>S</span> STORE · جرد</div>
    <div class="count">مسحت <b id="cnt">0</b></div>
  </header>

  <button id="startBtn" style="width:100%;padding:16px;font-size:17px;margin-bottom:10px" onclick="startCam()">📷 تشغيل الكاميرا</button>
  <div id="reader"></div>
  <div id="res" class="res">اضغط "تشغيل الكاميرا" أو اكتب السيريال يدوي…<div class="sub" id="sub"></div></div>

  <div class="row">
    <input id="manual" type="text" inputmode="latin" placeholder="أو اكتب السيريال يدوي…">
    <button onclick="submitManual()">تحقّق</button>
  </div>

  <div class="row">
    <button style="flex:1" onclick="doFinish()">📋 إنهاء الجرد وإرسال الناقص للتطبيق</button>
  </div>

  <div class="row" id="resetRow">
    <button class="ghost" style="flex:1" onclick="askReset()">♻️ تصفير الجرد</button>
  </div>
  <div class="row" id="confirmRow" style="display:none">
    <button onclick="doReset()" style="flex:1;background:var(--bad);color:#fff">✓ أكيد، صفّر الكل</button>
    <button class="ghost" style="flex:1" onclick="cancelReset()">✗ تراجع</button>
  </div>

  <details id="cfg">
    <summary>⚙️ الإعداد (مرة وحدة)</summary>
    <label>رابط الـ Web App من Apps Script (ينتهي بـ /exec)</label>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/XXXX/exec">
    <div class="row">
      <button onclick="saveUrl()">حفظ الرابط</button>
      <button class="ghost" onclick="resetCam()">إعادة تشغيل الكاميرا</button>
    </div>
    <div class="hint">انشر السكربت: Deploy → Web app → Who has access: <b>Anyone</b> → انسخ الرابط والصقه هنا.</div>
  </details>

  <div class="log" id="log"></div>

<script>
  // اترك الفاضي وألصق الرابط من ⚙️ الإعداد بالتلفون، أو حطه هون مباشرة بين علامتي الاقتباس
  var DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwvaVsroOK2BZLj5USyZvKURWrqeEYww4mWaZ2BSRvOYdhdqn17oumYgr63zAZyRDLn/exec';
  var WAURL = localStorage.getItem('as_waurl2') || DEFAULT_URL;
  var cnt = 0, last = '', lastT = 0, queue = [], pumping = false, seen = {}, okCount = 0, _ac;
  var resEl = document.getElementById('res'), subEl = document.getElementById('sub');

  if (WAURL) { document.getElementById('url').value = WAURL; }
  else { document.getElementById('cfg').open = true; subEl.textContent = 'الصق رابط الـ Web App بالإعداد أولاً'; }

  function saveUrl(){
    var v = document.getElementById('url').value.trim();
    if(!/\/exec$/.test(v)){ alert('الرابط لازم ينتهي بـ /exec'); return; }
    WAURL = v; localStorage.setItem('as_waurl2', v);
    document.getElementById('cfg').open = false;
    setRes('تم حفظ الرابط ✓ — ابدأ المسح', '');
  }

  function setRes(text, cls, sub){
    resEl.className = 'res' + (cls ? ' ' + cls : '');
    resEl.firstChild.nodeValue = text;
    subEl.textContent = sub || '';
  }
  function logLine(text, cls){
    var d = document.createElement('div'); d.className = 't-'+cls; d.textContent = text;
    var L = document.getElementById('log'); L.insertBefore(d, L.firstChild);
  }

  function jsonp(serial){
    return new Promise(function(resolve){
      if(!WAURL){ resolve({text:'ما في رابط — افتح الإعداد', cls:'bad'}); return; }
      var cb = 'cb' + Date.now() + Math.floor(Math.random()*999);
      var s = document.createElement('script');
      var done = false;
      window[cb] = function(r){ done=true; resolve(r); cleanup(); };
      function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); }
      s.onerror = function(){ if(!done){ resolve({text:'فشل الاتصال بالسكربت', cls:'bad'}); cleanup(); } };
      setTimeout(function(){ if(!done){ resolve({text:'انتهى الوقت — تأكد الرابط Anyone', cls:'bad'}); cleanup(); } }, 9000);
      s.src = WAURL + '?serial=' + encodeURIComponent(serial) + '&callback=' + cb;
      document.body.appendChild(s);
    });
  }

  // طنّة سريعة للفيدباك وأنت تمسح بسرعة بدون ما تبصّ عالشاشة
  function beep(){
    try{
      _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
      if(_ac.state === 'suspended') _ac.resume();
      var o = _ac.createOscillator(), g = _ac.createGain();
      o.connect(g); g.connect(_ac.destination);
      o.frequency.value = 880; g.gain.value = 0.06;
      o.start(); setTimeout(function(){ try{o.stop();}catch(e){} }, 85);
    }catch(e){}
  }

  // المسح: فوري — يعدّ ويطنّ ويحطّه بالطابور، بدون ما يستنى رد السيرفر
  function handle(serial){
    serial = (serial||'').trim(); if(!serial) return;
    var now = Date.now();
    if(serial === last && now - lastT < 1500) return;   // نفس الكود المكرر بسرعة
    last = serial; lastT = now;
    if(seen[serial]){ return; }  // مَسحته قبل بنفس الجلسة — تجاهل بصمت (عشان المسح الجماعي)
    seen[serial] = true;
    cnt++; document.getElementById('cnt').textContent = cnt;   // عدّ فوري
    beep(); if(navigator.vibrate) navigator.vibrate(80);       // فيدباك فوري
    enqueue(serial);
    setRes('📤 ' + serial, '', 'بالطابور: ' + queue.length + ' · تأكّد: ' + okCount);
  }

  // الطابور: يبعت واحد واحد بالخلفية عشان ما يزنّق سيرفر جوجل — والمسح يضل فوري
  function enqueue(serial){ queue.push(serial); pump(); }
  function pump(){
    if(pumping) return;
    var next = queue.shift();
    if(next === undefined){ pumping = false; return; }
    pumping = true;
    jsonp(next).then(function(r){
      if(r.cls === 'ok'){ okCount++; logLine(r.text, 'ok'); }
      else if(r.cls === 'dup'){ logLine(r.text, 'dup'); }
      else { logLine('⚠️ ' + r.text, 'bad'); delete seen[next]; }  // فشل/مش موجود → اسمح تعيد مسحه
      subEl.textContent = 'بالطابور: ' + queue.length + ' · تأكّد: ' + okCount;
      pumping = false; pump();
    });
  }

  function submitManual(){
    var m = document.getElementById('manual');
    handle(m.value); m.value=''; m.focus();
  }
  document.getElementById('manual').addEventListener('keydown', function(e){ if(e.key==='Enter') submitManual(); });

  // طلب عام للسكربت (إنهاء / تصفير)
  function callAction(action, waitText, timeoutMs, onDone){
    if(!WAURL){ setRes('ما في رابط — افتح الإعداد', 'bad'); return; }
    setRes(waitText, '');
    var cb = 'cb' + Date.now() + Math.floor(Math.random()*999);
    var s = document.createElement('script'); var done = false;
    function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); }
    window[cb] = function(r){ done=true; setRes(r.text, r.cls||'ok'); if(onDone) onDone(r); cleanup(); };
    s.onerror = function(){ if(!done){ setRes('فشل الاتصال بالسكربت', 'bad'); cleanup(); } };
    setTimeout(function(){ if(!done){ setRes('انتهى الوقت — تأكد الرابط Anyone', 'bad'); cleanup(); } }, timeoutMs);
    s.src = WAURL + '?action=' + action + '&callback=' + cb;
    document.body.appendChild(s);
  }

  // إنهاء الجرد وإرسال الناقص للتطبيق
  function doFinish(){
    if(pumping || queue.length){ setRes('استنى الطابور يخلص (' + queue.length + ')', 'dup'); return; }
    if(!okCount){ setRes('ما في أجهزة ممسوحة — امسح أولاً', 'bad'); return; }
    if(!confirm('أنهي الجرد وأرسل كل جهاز ما انمسح للتطبيق؟')) return;
    callAction('finish', '… جاري الإرسال', 25000);
  }

  // تصفير الجرد بتأكيد بضغطتين
  function askReset(){
    document.getElementById('resetRow').style.display='none';
    document.getElementById('confirmRow').style.display='flex';
    setRes('متأكد تصفّر الجرد؟', 'dup', 'بتتمسح الأجهزة الممسوحة وقائمة الناقص');
  }
  function cancelReset(){
    document.getElementById('confirmRow').style.display='none';
    document.getElementById('resetRow').style.display='flex';
    setRes('تم الإلغاء — ما صار إشي', '');
  }
  function doReset(){
    document.getElementById('confirmRow').style.display='none';
    document.getElementById('resetRow').style.display='flex';
    callAction('reset', '… جاري التصفير', 20000, function(){
      cnt=0; okCount=0; seen={}; queue=[]; last='';
      document.getElementById('cnt').textContent='0';
    });
  }

  // ====== الكاميرا ======
  // الوضع الأول (الأسرع): BarcodeDetector الأصلي — بيقرا كذا ستيكر بنفس اللقطة (أندرويد/كروم).
  // لو مش مدعوم (آيفون غالباً) → يرجع لـ html5-qrcode (ستيكر واحد كل مرة).
  var qr = null, camOn = false, usingNative = false;
  var nStream = null, nDet = null, nVideo = null, nTimer = null;
  var FORMATS = ['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];

  function startCam(){
    document.getElementById('startBtn').style.display = 'none';
    if('BarcodeDetector' in window){ startNative(); } else { startQr(); }
  }

  function startNative(){
    try{ nDet = new window.BarcodeDetector({ formats: FORMATS }); }
    catch(e){ startQr(); return; }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} } })
    .then(function(stream){
      nStream = stream;
      var r = document.getElementById('reader'); r.innerHTML = '';
      nVideo = document.createElement('video');
      nVideo.setAttribute('playsinline',''); nVideo.muted = true;
      nVideo.style.width = '100%'; nVideo.style.borderRadius = '16px'; nVideo.style.display = 'block';
      r.appendChild(nVideo);
      nVideo.srcObject = stream;
      return nVideo.play();
    })
    .then(function(){
      usingNative = true; camOn = true;
      setRes('📷 مرّر الكاميرا فوق الأجهزة — بيقرا كذا ستيكر مرة وحدة', '');
      tickNative();
    })
    .catch(function(e){ startQr(); });
  }

  function tickNative(){
    if(!usingNative){ return; }
    nDet.detect(nVideo).then(function(codes){
      for(var i=0;i<codes.length;i++){ handle(codes[i].rawValue); }
    }).catch(function(){}).then(function(){
      nTimer = setTimeout(tickNative, 180);   // ~5 لقطات بالثانية
    });
  }

  function startQr(){
    usingNative = false;
    if(!qr) qr = new Html5Qrcode('reader');
    qr.start({ facingMode: 'environment' }, {
        fps: 15,
        // نافذة عريضة وكبيرة عشان التمرير يمسك الستيكر من غير تصويب دقيق
        qrbox: function(vw, vh){ return { width: Math.round(vw * 0.92), height: Math.round(vh * 0.55) }; },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.DATA_MATRIX
        ]
      },
      function(txt){ handle(txt); })
    .then(function(){ camOn = true; setRes('📷 وجّه الكاميرا على الستيكر — واحد كل مرة','',''); })
    .catch(function(e){
      document.getElementById('startBtn').style.display = 'block';
      setRes('الكاميرا محجوبة هنا — افتح الصفحة بمتصفح كامل أو استعمل الكتابة اليدوية', 'bad', String(e));
    });
  }

  function stopCam(){
    camOn = false;
    if(usingNative){
      usingNative = false;
      if(nTimer){ clearTimeout(nTimer); nTimer = null; }
      if(nStream){ nStream.getTracks().forEach(function(t){ t.stop(); }); nStream = null; }
      return Promise.resolve();
    }
    if(qr){ return qr.stop().catch(function(){}); }
    return Promise.resolve();
  }
  function resetCam(){ stopCam().then(startCam); }
</script>
</body>
</html>
